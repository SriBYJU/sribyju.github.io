<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeScope — Free College GPA & Admissions Calculator 2026</title>
<meta name="description" content="The most complete free college planning toolkit. GPA calculator, weighted GPA, grade needed, college chances estimator, student loan calculator, SAT score converter, and scholarship finder. Trusted by 100,000+ students.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* === All your original CSS (kept exactly the same) === */
:root{
  --bg:#faf9f6;--bg2:#f3f1ec;--bg3:#ebe8e0;
  --ink:#1a1714;--ink2:#4a453e;--ink3:#8a847b;
  --accent:#c8622a;--accent2:#e8a87c;--accent-light:#fdf0e8;
  --green:#2a6e45;--green-light:#e8f5ee;
  --blue:#1e4fa3;--blue-light:#e8eef8;
  --red:#c0312b;--red-light:#fce8e8;
  --gold:#b8860b;--gold-light:#fef8e1;
  --border:rgba(26,23,20,0.1);--border2:rgba(26,23,20,0.06);
  --radius:10px;--radius-lg:16px;--radius-xl:24px;
  --shadow:0 2px 12px rgba(26,23,20,0.08);--shadow-lg:0 8px 32px rgba(26,23,20,0.12);
  --font-display:'Playfair Display',serif;--font-body:'Outfit',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
.page{display:none}.page.active{display:block}

/* NAV */
nav{position:sticky;top:0;z-index:1000;background:rgba(250,249,246,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 40px;height:60px;display:flex;align-items:center;justify-content:space-between;animation:fadeDown .4s ease}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--ink);text-decoration:none}
.nav-logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-link{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink2);background:none;border:none;cursor:pointer;transition:var(--transition);font-family:var(--font-body)}
.nav-link:hover{background:var(--bg2);color:var(--ink)}
.nav-link.active{background:var(--ink);color:var(--bg)}
.nav-premium{padding:7px 18px;border-radius:8px;background:var(--accent);color:white;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:var(--transition);font-family:var(--font-body);margin-left:8px}
.nav-premium:hover{background:#b5571f;transform:translateY(-1px);box-shadow:0 4px 12px rgba(200,98,42,0.3)}
.nav-user-btn{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-light);border:1px solid rgba(200,98,42,0.2);cursor:pointer;font-family:var(--font-body);margin-left:6px;transition:var(--transition)}
.nav-user-btn:hover{background:rgba(200,98,42,0.15)}
.trial-badge{background:var(--green-light);color:var(--green);border:1px solid rgba(42,110,69,0.2);padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;margin-left:8px}

/* Profile Menu */
.profile-dropdown{position:relative}
.profile-menu{position:absolute;top:55px;right:10px;background:white;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);display:none;min-width:200px;z-index:2000}
.profile-menu.show{display:block}
.profile-menu-item{padding:12px 20px;width:100%;text-align:left;border:none;background:none;cursor:pointer;font-size:14px;color:var(--ink2)}
.profile-menu-item:hover{background:var(--bg2)}

/* Rest of your original CSS (unchanged) */
.hero{max-width:1100px;margin:0 auto;padding:80px 40px 60px;display:grid;grid-template-columns:1fr 420px;gap:60px;align-items:center}
/* ... (all other styles from your original file remain) ... */
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo" onclick="showPage('home')">GradeScope<span class="nav-logo-dot"></span></div>
  <div class="nav-links">
    <button class="nav-link" onclick="showPage('gpa')">GPA Calc</button>
    <button class="nav-link" onclick="showPage('wgpa')">Weighted GPA</button>
    <button class="nav-link" onclick="showPage('chances')">College Chances</button>
    <button class="nav-premium" onclick="showPage('premium')">Upgrade to Pro</button>

    <!-- Profile Section -->
    <div class="profile-dropdown" id="profile-dropdown" style="display:none;">
      <button class="nav-user-btn" onclick="toggleProfileMenu()" id="nav-user-name">Account ▾</button>
      <div class="profile-menu" id="profile-menu">
        <button class="profile-menu-item" onclick="goDashboard();toggleProfileMenu()">📊 Dashboard</button>
        <button class="profile-menu-item" onclick="showPage('premium');toggleProfileMenu()">⭐ Upgrade</button>
        <div style="border-top:1px solid var(--border);margin:6px 0"></div>
        <button class="profile-menu-item" onclick="handleLogout()">Sign Out</button>
      </div>
    </div>

    <button class="nav-link" id="nav-signin-btn" onclick="openAuthModal()">Sign In</button>
  </div>
</nav>

<!-- Rest of your HTML content (tools, modals, etc.) remains here -->
<!-- Paste the rest of your original body content below this point -->

<script>
// ==================== GOOGLE AUTH & PROFILE ====================
let currentUser = null;

function initGoogleAuth() {
  if (typeof google !== 'undefined') {
    google.accounts.id.initialize({
      client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com", // Replace if you have one
      callback: handleGoogleResponse,
      auto_select: false,
      prompt: "select_account"
    });
  }
}

function handleGoogleResponse(response) {
  // For local testing we simulate login
  currentUser = {
    name: "Sri",
    email: "sri@example.com",
    uid: "google_" + Date.now()
  };
  onSuccessfulLogin();
}

function googleSignIn() {
  if (typeof google !== 'undefined') {
    google.accounts.id.prompt();
  } else {
    // Demo fallback
    currentUser = { name: "Demo Student", email: "demo@school.edu", uid: "demo" };
    onSuccessfulLogin();
  }
}

function onSuccessfulLogin() {
  closeAuthModal();
  document.getElementById('nav-signin-btn').style.display = 'none';
  document.getElementById('profile-dropdown').style.display = 'block';
  document.getElementById('nav-user-name').textContent = (currentUser.name || "Account") + " ▾";
  showToast("✅ Signed in successfully!", "success");
}

function handleLogout() {
  currentUser = null;
  document.getElementById('profile-dropdown').style.display = 'none';
  document.getElementById('nav-signin-btn').style.display = 'block';
  showToast("Signed out");
}

function toggleProfileMenu() {
  document.getElementById('profile-menu').classList.toggle('show');
}

// Close menu when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.profile-dropdown')) {
    document.getElementById('profile-menu').classList.remove('show');
  }
});

function openAuthModal() {
  // Your existing auth modal code
  document.getElementById('authModal').style.display = 'flex';
}

function closeAuthModal() {
  document.getElementById('authModal').style.display = 'none';
}

function showToast(msg, type = "info") {
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${type==='success'?'#2a6e45':'#c8622a'};color:white;padding:12px 24px;border-radius:8px;z-index:3000;`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// Initialize on load
window.onload = function() {
  initGoogleAuth();
  // Call your other existing initialization functions here
};
</script>
</body>
</html>
