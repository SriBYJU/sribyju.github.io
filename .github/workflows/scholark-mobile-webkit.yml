name: ScholarK mobile WebKit stability

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'scholark-v3.js'
      - 'scholark-mobile.js'
      - 'scholark-mobile.css'
      - 'scholark-feature-loader.js'
      - 'scholark-ai-*.js'
      - 'scholark-ai-*.css'
      - 'scripts/mobile-webkit-stability.mjs'
      - '.github/workflows/scholark-mobile-webkit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scholark-v3.js'
      - 'scholark-mobile.js'
      - 'scholark-mobile.css'
      - 'scholark-feature-loader.js'
      - 'scholark-ai-*.js'
      - 'scholark-ai-*.css'
      - 'scripts/mobile-webkit-stability.mjs'
      - '.github/workflows/scholark-mobile-webkit.yml'

concurrency:
  group: scholark-mobile-webkit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps webkit

      - name: Start local ScholarK server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/scholark-mobile-server.log 2>&1 &
          echo $! > /tmp/scholark-mobile-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scholark-mobile-server.log
          exit 1

      - name: Run iPhone-like WebKit scroll stability audit
        env:
          SCHOLARK_TEST_URL: http://127.0.0.1:4173/
        shell: bash
        run: |
          set +e
          node scripts/mobile-webkit-stability.mjs 2>&1 | tee /tmp/scholark-mobile-audit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Preserve mobile audit diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scholark-mobile-webkit-diagnostics
          path: |
            /tmp/scholark-mobile-audit.log
            /tmp/scholark-mobile-server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Server log on failure
        if: failure()
        run: cat /tmp/scholark-mobile-server.log || true
