name: ScholarK mobile WebKit stability

on:
  push:
    branches:
      - main
    paths:
      - 'scholark-v3.js'
      - 'scholark-mobile.js'
      - 'scholark-mobile.css'
      - 'scripts/mobile-webkit-stability.mjs'
      - '.github/workflows/scholark-mobile-webkit.yml'
  pull_request:
    paths:
      - 'scholark-v3.js'
      - 'scholark-mobile.js'
      - 'scholark-mobile.css'
      - 'scripts/mobile-webkit-stability.mjs'
      - '.github/workflows/scholark-mobile-webkit.yml'

concurrency:
  group: scholark-mobile-webkit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Start local ScholarK server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/scholark-mobile-server.log 2>&1 &
          echo $! > /tmp/scholark-mobile-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scholark-mobile-server.log
          exit 1

      - name: Run iPhone-like WebKit scroll stability audit
        env:
          SCHOLARK_TEST_URL: http://127.0.0.1:4173/
        run: node scripts/mobile-webkit-stability.mjs

      - name: Server log on failure
        if: failure()
        run: cat /tmp/scholark-mobile-server.log || true
