name: Temporary version Scholark V3 loader

on:
  push:
    branches:
      - scholark-v3-loader-cache-key

permissions:
  contents: write

jobs:
  version-loader:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: scholark-v3-loader-cache-key
          fetch-depth: 0
      - name: Version loader and harden audits
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '<script src="scholark-v3.js" defer></script>'
          new = '<script src="scholark-v3.js?build=5151" defer></script>'
          assert text.count(old) == 1, f'expected one unversioned V3 loader, found {text.count(old)}'
          index.write_text(text.replace(old, new, 1))

          audit = Path('scripts/scholark-production-audit.sh')
          text = audit.read_text()
          old = "grep -q 'scholark-v3.js' \"$OUT/live-index.html\""
          new = "grep -Fq 'scholark-v3.js?build=5151' \"$OUT/live-index.html\""
          assert text.count(old) == 1, 'production audit V3 loader assertion not found exactly once'
          audit.write_text(text.replace(old, new, 1))

          spec = Path('scripts/scholark-cinematic-visual.spec.mjs')
          text = spec.read_text()
          anchor = "    expect(assetState.build).toBe(CINEMATIC_BUILD);\n"
          addition = "    expect(assetState.scriptSrcs.some(src => src.includes(`scholark-v3.js?build=${CINEMATIC_BUILD}`))).toBe(true);\n"
          assert text.count(anchor) == 1, 'cinematic asset assertion anchor not found exactly once'
          assert addition not in text, 'versioned V3 loader assertion already present'
          spec.write_text(text.replace(anchor, anchor + addition, 1))

          Path('.github/workflows/tmp-version-v3-loader.yml').unlink()
          PY
      - name: Commit branch-only cache-key fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/scholark-production-audit.sh scripts/scholark-cinematic-visual.spec.mjs .github/workflows/tmp-version-v3-loader.yml
          git commit -m "Version the top-level Scholark V3 loader"
          git push origin HEAD:scholark-v3-loader-cache-key
