name: Refresh scripts lockfile for reviews branch

on:
  push:
    branches:
      - feature/scholark-reviews
    paths:
      - 'scripts/package.json'
      - '.github/workflows/refresh-scripts-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scholark-reviews
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Refresh lockfile
        working-directory: scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- scripts/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/package-lock.json
          git commit -m "Refresh scripts lockfile after security overrides"
          git push origin HEAD:feature/scholark-reviews
