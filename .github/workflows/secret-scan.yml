name: Frontend secret scan

on:
  push:
    branches:
      - main
      - scholark-legal-security
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan public source for private credentials
        run: node scripts/secret-scan.js
