name: Weekly Email

on:
  schedule:
    # Every Monday at 13:15 UTC (9:15 AM EDT / 8:15 AM EST)
    - cron: '15 13 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: scholark-weekly-email
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-emails:
    if: vars.WEEKLY_EMAIL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Block high-severity production dependency advisories
        working-directory: scripts
        run: npm audit --omit=dev --audit-level=high

      - name: Validate email script
        working-directory: scripts
        run: node --check send-weekly-email.js

      - name: Send weekly emails
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_UNSUBSCRIBE_ADDRESS: ${{ vars.EMAIL_UNSUBSCRIBE_ADDRESS }}
        run: node send-weekly-email.js
