name: Deploy Scholark Firestore rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'scripts/deploy-firestore-rules-direct.mjs'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

concurrency:
  group: scholark-firestore-rules
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate direct deploy script
        run: node --check scripts/deploy-firestore-rules-direct.mjs

      - name: Deploy Firestore security rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: gradescope-539dd
        run: node scripts/deploy-firestore-rules-direct.mjs
