name: ScholarK mobile startup hardening

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-mobile-performance-hardening.js'
      - '.github/workflows/scholark-mobile-performance-hardening.yml'

permissions:
  contents: write

jobs:
  harden-mobile-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile performance patch
        run: node scripts/apply-mobile-performance-hardening.js

      - name: Commit generated index hardening
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "perf: lazy-load heavy study engines on startup"
          git push
