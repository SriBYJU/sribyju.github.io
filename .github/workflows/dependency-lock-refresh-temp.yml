name: Temporary dependency lock refresh

on:
  push:
    branches:
      - scholark-ai-quality-recovery
    paths:
      - 'scripts/package.json'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: scholark-ai-quality-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Regenerate lockfile without executing package scripts
        working-directory: scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit deterministic lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'Refresh dependency lockfile after security upgrade'
          git push origin HEAD:scholark-ai-quality-recovery
