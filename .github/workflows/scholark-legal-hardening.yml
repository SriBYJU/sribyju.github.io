name: Scholark legal hardening

on:
  push:
    branches:
      - scholark-legal-security
      - scholark-v58-polish
    paths:
      - 'scripts/apply-legal-hardening.js'
      - '.github/workflows/scholark-legal-hardening.yml'
      - 'scholark-legal.js'
      - 'privacy.html'
      - 'terms.html'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply legal and social metadata hardening
        run: node scripts/apply-legal-hardening.js

      - name: Commit generated index update
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: apply Scholark non-commercial legal metadata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
