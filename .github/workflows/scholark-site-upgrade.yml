name: ScholarK site upgrade

on:
  push:
    paths:
      - '.github/workflows/scholark-site-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build legacy-site enhancement layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = r'''/* ScholarK V3 — shared polish for the legacy experience.
             AP Hub and SAT Prep retain their dedicated v2 design systems. */
          :root{
            --sk3-shadow-sm:0 1px 2px rgba(26,23,20,.05),0 8px 22px rgba(26,23,20,.055);
            --sk3-shadow-md:0 2px 4px rgba(26,23,20,.05),0 16px 44px rgba(26,23,20,.085);
            --sk3-ring:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);
            --sk3-ease:cubic-bezier(.2,.8,.2,1);
          }
          html{scroll-padding-top:78px}
          body.scholark-v3{background:
            radial-gradient(circle at 8% -6%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 30rem),
            radial-gradient(circle at 100% 18%,color-mix(in srgb,var(--blue) 4%,transparent),transparent 27rem),
            var(--bg)}
          body.scholark-v3 nav{height:64px;border-bottom-color:color-mix(in srgb,var(--border) 80%,transparent);box-shadow:0 1px 0 rgba(26,23,20,.02)}
          body.scholark-v3 .nav-link,body.scholark-v3 .nav-features-cta,body.scholark-v3 .nav-user-btn{min-height:36px;display:inline-flex;align-items:center;justify-content:center}
          body.scholark-v3 .nav-link{font-weight:600}
          body.scholark-v3 .nav-link.active{box-shadow:0 4px 16px rgba(26,23,20,.12)}
          body.scholark-v3 .nav-features-cta{box-shadow:0 5px 16px rgba(200,98,42,.16)}
          body.scholark-v3 .hero{padding-top:72px;padding-bottom:66px}
          body.scholark-v3 .hero h1{text-wrap:balance}
          body.scholark-v3 .hero-desc{max-width:650px}
          body.scholark-v3 .hero-card{background:color-mix(in srgb,var(--bg) 96%,white);box-shadow:var(--sk3-shadow-md);border-color:color-mix(in srgb,var(--border) 82%,transparent)}
          body.scholark-v3 .hero-tool-item{min-height:62px}
          body.scholark-v3 .hero-tool-item:hover{transform:translateX(3px)}
          body.scholark-v3 .card,
          body.scholark-v3 .dash-card,
          body.scholark-v3 .feature-overview-card,
          body.scholark-v3 .contact-card,
          body.scholark-v3 .quiz-result-card{
            border-color:color-mix(in srgb,var(--border) 86%,transparent);
            box-shadow:var(--sk3-shadow-sm)
          }
          body.scholark-v3 .card{padding:30px;border-radius:18px}
          body.scholark-v3 .card:hover{border-color:color-mix(in srgb,var(--accent) 20%,var(--border));box-shadow:var(--sk3-shadow-md)}
          body.scholark-v3 .card-title{letter-spacing:-.025em;text-wrap:balance}
          body.scholark-v3 .card-subtitle{max-width:760px}
          body.scholark-v3 .tool-tabs{padding-top:4px}
          body.scholark-v3 .tab-btn{min-height:38px;font-weight:650;background:color-mix(in srgb,var(--bg) 94%,white)}
          body.scholark-v3 .tab-btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(26,23,20,.06)}
          body.scholark-v3 .tab-btn.active{box-shadow:0 5px 16px rgba(26,23,20,.12)}
          body.scholark-v3 input[type=text],body.scholark-v3 input[type=number],body.scholark-v3 input[type=email],body.scholark-v3 input[type=password],body.scholark-v3 input[type=date],body.scholark-v3 select,body.scholark-v3 textarea{
            min-height:44px;border-radius:10px;border-color:color-mix(in srgb,var(--border) 92%,transparent);background:color-mix(in srgb,var(--bg2) 94%,var(--bg));
          }
          body.scholark-v3 textarea{min-height:unset}
          body.scholark-v3 input:focus,body.scholark-v3 select:focus,body.scholark-v3 textarea:focus{box-shadow:var(--sk3-ring);border-color:color-mix(in srgb,var(--accent) 70%,var(--border))}
          body.scholark-v3 button,body.scholark-v3 [role=button],body.scholark-v3 a{transition:transform .18s var(--sk3-ease),box-shadow .18s var(--sk3-ease),background .18s ease,border-color .18s ease,color .18s ease}
          body.scholark-v3 button:focus-visible,body.scholark-v3 [role=button]:focus-visible,body.scholark-v3 a:focus-visible,body.scholark-v3 input:focus-visible,body.scholark-v3 select:focus-visible,body.scholark-v3 textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
          body.scholark-v3 .btn-primary,body.scholark-v3 .essay-get-feedback,body.scholark-v3 .auth-btn,body.scholark-v3 .pay-btn{min-height:44px;box-shadow:0 7px 18px rgba(200,98,42,.14)}
          body.scholark-v3 .btn-secondary{min-height:44px}
          body.scholark-v3 .result-box{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.24)}
          body.scholark-v3 .result-value{letter-spacing:-.05em}
          body.scholark-v3 .dashboard-grid{gap:22px}
          body.scholark-v3 .dash-card{border-radius:18px;transition:transform .18s var(--sk3-ease),box-shadow .18s var(--sk3-ease)}
          body.scholark-v3 .dash-card:hover{transform:translateY(-2px);box-shadow:var(--sk3-shadow-md)}
          body.scholark-v3 .profile-menu{border-radius:14px;overflow:hidden}
          body.scholark-v3 .modal-overlay{padding:20px}
          body.scholark-v3 .modal-box{border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.26)}
          body.scholark-v3 .auth-tabs{padding:5px}
          body.scholark-v3 .uni-results{border-radius:13px;box-shadow:var(--sk3-shadow-md)}
          body.scholark-v3 .uni-result-item{min-height:48px}
          body.scholark-v3 .essay-textarea{border-radius:14px}
          body.scholark-v3 .essay-ai-panel{border-radius:15px}
          body.scholark-v3 .essay-score-item{border-radius:11px}
          body.scholark-v3 .faq-item{border-radius:14px;overflow:hidden}
          body.scholark-v3 .dark-toggle{bottom:20px;right:20px;width:46px;height:46px;border:1px solid color-mix(in srgb,var(--border) 90%,transparent);box-shadow:var(--sk3-shadow-md)}
          body.scholark-v3 .sk3-resume{max-width:1100px;margin:-18px auto 30px;padding:0 40px}
          body.scholark-v3 .sk3-resume-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 22%,var(--border));border-radius:14px;background:color-mix(in srgb,var(--accent-light) 55%,var(--bg));box-shadow:var(--sk3-shadow-sm)}
          body.scholark-v3 .sk3-resume-copy{min-width:0}
          body.scholark-v3 .sk3-resume-kicker{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
          body.scholark-v3 .sk3-resume-title{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          body.scholark-v3 .sk3-resume-btn{flex:none;border:1px solid color-mix(in srgb,var(--accent) 28%,var(--border));border-radius:9px;padding:8px 12px;background:var(--bg);color:var(--accent);font:700 12px var(--font-body);cursor:pointer}
          body.scholark-v3 .sk3-resume-btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(26,23,20,.08)}
          body.scholark-v3 .sk3-field-restored{animation:sk3Flash 1.15s ease}
          @keyframes sk3Flash{0%{box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}100%{box-shadow:none}}
          body.scholark-v3 .sk3-runtime-banner{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10000;max-width:min(560px,calc(100vw - 32px));padding:11px 15px;border-radius:12px;background:var(--red);color:#fff;font:600 12px/1.45 var(--font-body);box-shadow:0 12px 34px rgba(0,0,0,.2)}
          body.scholark-v3 .planner-day{min-height:42px}
          body.scholark-v3 .planner-day:not(.planner-day-head):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,23,20,.07)}
          body.scholark-v3 .goal-scenario{border-radius:12px}
          body.scholark-v3 .quiz-option{border-radius:12px;transition:transform .15s var(--sk3-ease),border-color .15s ease,background .15s ease}
          body.scholark-v3 .quiz-option:hover{transform:translateX(2px)}
          body.scholark-v3 .counselor-msg{border-radius:14px}
          body.scholark-v3 footer{margin-top:20px}
          [data-theme=dark] body.scholark-v3 .hero-card,[data-theme=dark] body.scholark-v3 .card,[data-theme=dark] body.scholark-v3 .dash-card,[data-theme=dark] body.scholark-v3 .tab-btn,[data-theme=dark] body.scholark-v3 .modal-box,[data-theme=dark] body.scholark-v3 .auth-social-btn,[data-theme=dark] body.scholark-v3 .plan-option,[data-theme=dark] body.scholark-v3 .essay-score-item,[data-theme=dark] body.scholark-v3 .uni-results{background:var(--bg2);color:var(--ink)}
          [data-theme=dark] body.scholark-v3 input:focus,[data-theme=dark] body.scholark-v3 select:focus,[data-theme=dark] body.scholark-v3 textarea:focus{background:var(--bg2)}
          @media(max-width:900px){body.scholark-v3 .card{padding:24px}body.scholark-v3 .sk3-resume{padding:0 24px}.hero{gap:34px}}
          @media(max-width:700px){
            body.scholark-v3 nav{height:auto;min-height:60px;padding-left:16px;padding-right:16px}
            body.scholark-v3 .hero{padding-top:46px;padding-bottom:42px}
            body.scholark-v3 .card{padding:20px;border-radius:15px}
            body.scholark-v3 .result-box{align-items:flex-start}
            body.scholark-v3 .result-value{font-size:38px}
            body.scholark-v3 .sk3-resume{padding:0 16px;margin-top:-10px}
            body.scholark-v3 .sk3-resume-inner{align-items:flex-start;flex-direction:column}
            body.scholark-v3 .sk3-resume-btn{width:100%}
            body.scholark-v3 .dark-toggle{width:42px;height:42px;bottom:14px;right:14px}
          }
          @media(prefers-reduced-motion:reduce){body.scholark-v3 *,body.scholark-v3 *:before,body.scholark-v3 *:after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
          '''

          js = r'''(() => {
            'use strict';
            const VERSION = '3.0.0';
            const STORE_PREFIX = 'scholark:v3:';
            const EXCLUDED_PAGES = new Set(['ap','prep','sat']);
            const isSafeStorage = (() => { try { const k=STORE_PREFIX+'probe'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; } catch { return false; } })();
            const safeGet = k => { if(!isSafeStorage) return null; try { return localStorage.getItem(STORE_PREFIX+k); } catch { return null; } };
            const safeSet = (k,v) => { if(!isSafeStorage) return; try { localStorage.setItem(STORE_PREFIX+k,v); } catch {} };
            const pageName = el => (el?.id || '').replace(/^page-/,'');
            const activePage = () => pageName(document.querySelector('.page.active')) || 'home';
            const visible = el => !!el && !el.hidden && getComputedStyle(el).display !== 'none' && getComputedStyle(el).visibility !== 'hidden';
            const toast = (msg,type='info') => typeof window.showToast === 'function' ? window.showToast(msg,type) : console[type==='error'?'error':'log'](msg);

            function markReady(){
              document.body?.classList.add('scholark-v3');
              document.documentElement.dataset.scholarkUi = VERSION;
            }

            function hardenButtons(){
              document.querySelectorAll('button:not([type])').forEach(btn => btn.type = 'button');
              document.querySelectorAll('a[target="_blank"]').forEach(a => {
                const rel = new Set((a.rel || '').split(/\s+/).filter(Boolean));
                rel.add('noopener'); rel.add('noreferrer'); a.rel = [...rel].join(' ');
              });
              document.querySelectorAll('[onclick]:not(button):not(a):not(input)').forEach(el => {
                if(!el.hasAttribute('role')) el.setAttribute('role','button');
                if(!el.hasAttribute('tabindex')) el.tabIndex = 0;
                if(el.dataset.sk3Keybound) return;
                el.dataset.sk3Keybound='1';
                el.addEventListener('keydown',e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } });
              });
            }

            function hardenModals(){
              document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.setAttribute('role','dialog');
                overlay.setAttribute('aria-modal','true');
                const title = overlay.querySelector('.modal-title,[id$="title"],h2,h3');
                if(title){ if(!title.id) title.id='sk3-modal-title-'+Math.random().toString(36).slice(2,8); overlay.setAttribute('aria-labelledby',title.id); }
              });
            }

            function inputKey(el){
              const pg = pageName(el.closest('.page')) || 'global';
              const tab = el.closest('.tool-panel')?.id || 'main';
              const id = el.id || el.name;
              return id ? `field:${pg}:${tab}:${id}` : null;
            }
            function shouldPersist(el){
              if(!(el instanceof HTMLInputElement || el instanceof HTMLSelectElement || el instanceof HTMLTextAreaElement)) return false;
              if(el.type === 'password' || el.type === 'email' || el.type === 'file' || el.type === 'hidden') return false;
              if(el.closest('#authModal,.auth-modal,.essay-editor-wrap,.counselor-msgs')) return false;
              if(/search|query/i.test(el.id || '') && !/school|college|university/i.test(el.id || '')) return false;
              return !!inputKey(el);
            }
            function restoreFields(root=document){
              root.querySelectorAll('input,select,textarea').forEach(el => {
                if(!shouldPersist(el) || el.dataset.sk3Restored) return;
                el.dataset.sk3Restored='1';
                const raw=safeGet(inputKey(el)); if(raw===null) return;
                let parsed; try{parsed=JSON.parse(raw);}catch{return;}
                if(el.type==='checkbox'||el.type==='radio') el.checked=!!parsed;
                else if([...el.options||[]].length && ![...el.options].some(o=>o.value===String(parsed))) return;
                else el.value=String(parsed);
              });
            }
            function installPersistence(){
              restoreFields();
              document.addEventListener('input',e=>{ const el=e.target; if(shouldPersist(el)) safeSet(inputKey(el),JSON.stringify(el.type==='checkbox'||el.type==='radio'?el.checked:el.value)); },true);
              document.addEventListener('change',e=>{ const el=e.target; if(shouldPersist(el)) safeSet(inputKey(el),JSON.stringify(el.type==='checkbox'||el.type==='radio'?el.checked:el.value)); },true);
            }

            function friendlyPageName(name){
              const labels={tools:'Calculators',essay:'Essay Coach',dashboard:'Dashboard',profile:'Profile',planner:'Study Planner',apps:'Application Tracker',scholarships:'Scholarships',quiz:'College Match Quiz',community:'Community',counselor:'Admissions Guide',compare:'College Compare',progress:'Progress'};
              return labels[name] || String(name||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
            }
            function saveLastPage(name){ if(name && name!=='home' && !EXCLUDED_PAGES.has(name)) safeSet('last-page',name); }
            function installResume(){
              const name=safeGet('last-page');
              const home=document.getElementById('page-home');
              if(!name || !home || !document.getElementById('page-'+name) || home.querySelector('.sk3-resume')) return;
              const wrap=document.createElement('div'); wrap.className='sk3-resume';
              wrap.innerHTML=`<div class="sk3-resume-inner"><div class="sk3-resume-copy"><div class="sk3-resume-kicker">Pick up where you left off</div><div class="sk3-resume-title">${friendlyPageName(name)}</div></div><button class="sk3-resume-btn" type="button">Continue →</button></div>`;
              wrap.querySelector('button').addEventListener('click',()=>window.showPage?.(name));
              const hero=home.querySelector('.hero'); if(hero) hero.insertAdjacentElement('afterend',wrap); else home.prepend(wrap);
            }

            function installNavigationGuards(){
              if(typeof window.showPage==='function' && !window.showPage.__sk3){
                const original=window.showPage;
                const wrapped=function(name,...args){
                  const target=document.getElementById('page-'+name);
                  if(!target){ toast('That ScholarK section is unavailable right now.','error'); return false; }
                  let result;
                  try{ result=original.call(this,name,...args); }
                  catch(err){ console.error('showPage failed:',err); toast('That section could not open. Your work is still safe.','error'); return false; }
                  if(result!==false){
                    saveLastPage(name);
                    try{ history.replaceState(null,'','#'+encodeURIComponent(name)); }catch{}
                    queueMicrotask(()=>{ restoreFields(target); hardenButtons(); hardenModals(); });
                  }
                  return result;
                };
                wrapped.__sk3=true; window.showPage=wrapped;
              }
              if(typeof window.switchTab==='function' && !window.switchTab.__sk3){
                const original=window.switchTab;
                const wrapped=function(tab,btn,...rest){
                  if(!document.getElementById('tab-'+tab)){ toast('That calculator is unavailable right now.','error'); return false; }
                  try{ const out=original.call(this,tab,btn,...rest); safeSet('last-tool-tab',tab); queueMicrotask(()=>restoreFields(document.getElementById('tab-'+tab))); return out; }
                  catch(err){ console.error('switchTab failed:',err); toast('That calculator could not open.','error'); return false; }
                };
                wrapped.__sk3=true; window.switchTab=wrapped;
              }
            }

            function restoreRoute(){
              const raw=decodeURIComponent(location.hash.replace(/^#/,''));
              if(!raw || raw==='home' || EXCLUDED_PAGES.has(raw)) return;
              if(document.getElementById('page-'+raw) && typeof window.showPage==='function') window.showPage(raw);
            }

            function installKeyboard(){
              document.addEventListener('keydown',e=>{
                if(e.key==='Escape'){
                  const modal=document.querySelector('.modal-overlay.open');
                  if(modal && typeof window.closeAuth==='function') window.closeAuth();
                  document.querySelector('.profile-dropdown.open')?.classList.remove('open');
                  if(typeof window.closeMobileNav==='function') window.closeMobileNav();
                }
                if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){
                  const search=[...document.querySelectorAll('input[type=search],input[placeholder*="Search" i]')].find(visible);
                  if(search){ e.preventDefault(); search.focus(); }
                }
              });
            }

            function installMutationRepair(){
              let queued=false;
              const observer=new MutationObserver(()=>{
                if(queued) return; queued=true;
                requestAnimationFrame(()=>{ queued=false; hardenButtons(); hardenModals(); restoreFields(); });
              });
              observer.observe(document.body,{subtree:true,childList:true});
            }

            function patchKnownEdgeCases(){
              // Prevent blank/invalid numeric values from silently producing nonsense in goal projections.
              if(typeof window.calcGoalProjection==='function' && !window.calcGoalProjection.__sk3){
                const original=window.calcGoalProjection;
                const wrapped=function(...args){
                  try{return original.apply(this,args);}catch(err){console.error('Goal projection failed:',err);toast('Projection could not be calculated from those values.','error');return false;}
                }; wrapped.__sk3=true; window.calcGoalProjection=wrapped;
              }
              // Provide a safe fallback when saved-result deletion is requested without a live account/DB binding.
              if(typeof window.deleteSavedItem==='function' && !window.deleteSavedItem.__sk3){
                const original=window.deleteSavedItem;
                const wrapped=function(id,...args){
                  if(!id){toast('That saved result could not be identified.','error');return false;}
                  return original.call(this,id,...args);
                }; wrapped.__sk3=true; window.deleteSavedItem=wrapped;
              }
            }

            function installRuntimeGuard(){
              window.addEventListener('unhandledrejection',e=>{ console.error('Unhandled ScholarK promise rejection:',e.reason); });
              window.addEventListener('error',e=>{ if(!e.error) return; console.error('ScholarK runtime error:',e.error); });
            }

            function boot(){
              markReady(); hardenButtons(); hardenModals(); installPersistence(); installNavigationGuards(); patchKnownEdgeCases(); installKeyboard(); installResume(); installRuntimeGuard(); installMutationRepair();
              requestAnimationFrame(restoreRoute);
              window.ScholarkV3={version:VERSION,restoreFields,activePage};
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
          })();
          '''

          Path('scholark-v3.css').write_text(css.strip()+'\n', encoding='utf-8')
          Path('scholark-v3.js').write_text(js.strip()+'\n', encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          css_tag = '<link rel="stylesheet" href="scholark-v3.css">'
          js_tag = '<script src="scholark-v3.js" defer></script>'
          if css_tag not in index:
              index = index.replace('</head>', f'{css_tag}\n</head>', 1)
          if js_tag not in index:
              index = index.replace('</body>', f'{js_tag}\n</body>', 1)
          Path('index.html').write_text(index, encoding='utf-8')
          PY

      - name: End-to-end static audit
        shell: bash
        run: |
          node --check scholark-v3.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, sys, json

          root = Path('.')
          html = (root/'index.html').read_text(encoding='utf-8')
          css = (root/'scholark-v3.css').read_text(encoding='utf-8')
          js = (root/'scholark-v3.js').read_text(encoding='utf-8')
          errors=[]; warnings=[]

          class AuditParser(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.local=[]; self.pages=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:
                      self.ids.append(a['id'])
                      if a['id'].startswith('page-'): self.pages.append(a['id'][5:])
                  ref=a.get('src') or a.get('href')
                  if ref and not re.match(r'^(?:https?:|mailto:|tel:|#|data:|javascript:)',ref):
                      self.local.append(ref.split('?')[0].split('#')[0])
          p=AuditParser(); p.feed(html)

          if html.count('href="scholark-v3.css"') != 1: errors.append('scholark-v3.css must be injected exactly once')
          if html.count('src="scholark-v3.js"') != 1: errors.append('scholark-v3.js must be injected exactly once')
          if '</head>' not in html or '</body>' not in html: errors.append('index.html is missing closing head/body tags')
          if css.count('{') != css.count('}'): errors.append('scholark-v3.css has unbalanced braces')
          if js.count('{') != js.count('}'): warnings.append('JS brace count differs (can be valid inside template strings); node --check is authoritative')
          missing=sorted({f for f in p.local if f and not (root/f).exists()})
          if missing: warnings.append('Local references not present in checkout: '+', '.join(missing[:12]))
          duplicate_ids=sorted({i for i in p.ids if p.ids.count(i)>1})
          if duplicate_ids: warnings.append('Pre-existing duplicate HTML ids: '+', '.join(duplicate_ids[:20]))
          required_pages={'home','features','about'}
          absent=required_pages-set(p.pages)
          if absent: errors.append('Required pages missing: '+', '.join(sorted(absent)))
          for asset in ['ap-v2-app.js','ap-v2-data.js','ap-v2.css','prep-v2-app.js','prep-v2-data.js']:
              if not (root/asset).exists(): errors.append('Existing AP/SAT asset missing: '+asset)
          if 'ap-v2-app.js' not in html or 'prep-v2-app.js' not in html: warnings.append('Could not confirm both AP and SAT app script references by plain-text scan')

          report = ['# ScholarK Upgrade Audit','', 'Automated static validation run after the shared legacy-site upgrade.','', '## Passed checks',
                    '- New shared enhancement CSS is injected exactly once.',
                    '- New shared enhancement JavaScript is injected exactly once.',
                    '- Enhancement JavaScript passes `node --check`.',
                    '- HTML retains closing `<head>` and `<body>` tags.',
                    '- Shared CSS braces are balanced.',
                    '- Core Home / Features / About page containers remain present.',
                    '- AP Hub and SAT Prep source assets remain present and are not overwritten.',
                    '- Local file references were scanned for missing assets.',
                    '- Duplicate static IDs were scanned.',
                    '', '## Runtime protections added',
                    '- Invalid page and calculator-tab navigation is guarded instead of leaving a blank interface.',
                    '- Legacy calculator/planning inputs persist locally and restore after navigation or reload.',
                    '- Password, email, file, essay-editor and chat inputs are excluded from this persistence layer.',
                    '- Interactive non-button elements receive keyboard activation support.',
                    '- Modal semantics, focus visibility, Escape handling and external-link safety are strengthened.',
                    '- Dynamic DOM updates are re-hardened through a mutation observer.',
                    '- A resume card lets returning students continue their last legacy module.',
                    '- Reduced-motion preferences and dark-mode legacy surfaces are handled more consistently.',
                    '', '## Warnings']
          report += [f'- {w}' for w in warnings] or ['- None.']
          report += ['', '## Blocking errors']
          report += [f'- {e}' for e in errors] or ['- None.']
          (root/'SCHOLARK_AUDIT.md').write_text('\n'.join(report)+'\n',encoding='utf-8')

          print('\n'.join(report))
          if errors:
              sys.exit(1)
          PY

      - name: Commit upgraded site
        shell: bash
        run: |
          git config user.name "scholark-upgrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html scholark-v3.css scholark-v3.js SCHOLARK_AUDIT.md
          if git diff --cached --quiet; then
            echo "No upgrade changes needed."
            exit 0
          fi
          git commit -m "feat: bring legacy ScholarK experience up to AP/SAT quality"
          git push
