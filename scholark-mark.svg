<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Scholark monogram</title>
  <desc id="desc">A turning-page S leading upward to a compass star.</desc>
  <defs>
    <linearGradient id="field" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E28A55"/>
      <stop offset="0.46" stop-color="#C8622A"/>
      <stop offset="1" stop-color="#963C19"/>
    </linearGradient>
    <linearGradient id="paper" x1="18" y1="14" x2="45" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F4E5D7"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.7" flood-color="#63240E" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#field)"/>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="#FFF8EE" stroke-opacity=".2"/>

  <g filter="url(#lift)">
    <!-- The upper page curls into the first turn of the S. -->
    <path d="M18.2 18.9C23.6 14.4 32.9 12.8 41.3 15.1L47.4 16.8L43.4 23.7L38.6 22.5C32.3 20.9 25.7 21.2 23.1 23.6C21.6 25 22.4 26.9 25.3 27.7L38.7 31.1C45.1 32.8 47.6 37.1 45.4 41.7C42.6 47.4 32.4 51.1 21.4 47.8L15.7 46.1L19.6 39.1L24.7 40.7C31 42.6 37.3 41.4 39.1 38.9C40.1 37.4 39 36 36.4 35.3L23 31.8C15.4 29.8 13.3 23 18.2 18.9Z" fill="url(#paper)"/>

    <!-- Page folds make the monogram feel printed and dimensional. -->
    <path d="M18.2 18.9C24.7 18.1 29.1 19.3 32.5 22.1C28.4 21.2 24.8 21.7 23.1 23.6C21.6 25 22.4 26.9 25.3 27.7L29.4 28.7C24.4 28.4 19.5 26.9 16.4 23.5C16.6 21.7 17.2 20.2 18.2 18.9Z" fill="#FFFFFF" fill-opacity=".72"/>
    <path d="M39.1 38.9C37.3 41.4 31 42.6 24.7 40.7L19.6 39.1L15.7 46.1L21.4 47.8C30.1 50.4 38.3 48.7 42.8 44.9C37.9 45.7 32.1 45 27.7 42.9C33.1 44 37.5 42.4 39.1 38.9Z" fill="#E9CFB8" fill-opacity=".75"/>

    <!-- The final page corner becomes a forward arrow. -->
    <path d="M39.4 14.7L49.7 14.2L44 23.9L41.9 19.4L39.4 14.7Z" fill="#FFFDF8"/>
  </g>

  <!-- Compass spark: direction, ambition, and the k-shaped final accent. -->
  <path d="M49.5 8.8L51 12.2L54.5 13.7L51 15.2L49.5 18.6L48 15.2L44.5 13.7L48 12.2L49.5 8.8Z" fill="#FFD48E"/>
  <circle cx="49.5" cy="13.7" r="1.15" fill="#FFFDF8"/>
</svg>
